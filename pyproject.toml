[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pypptx"
version = "0.3.2"
description = "Create, read, and modify PowerPoint .pptx files"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "lxml>=4.9",
    "typing_extensions>=4.4",
    "XlsxWriter>=3.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # tests/unitutil/cxml.py parses the compact XML expression language with pyparsing.
    # Capped below 4: it still calls `delimitedList`, `setParseAction`, `dblQuotedString`
    # and `removeQuotes`, which 3.x deprecates (the suite emits the warnings) and 4.x is
    # expected to remove.
    "pyparsing>=3.0,<4",
    # tests/oxml/test_simpletypes_properties.py: property-based tests of the simple types.
    "hypothesis>=6",
]
# Builds the API reference in docs/: `sphinx-build -W -b html docs docs/_build/html`.
docs = [
    # sphinx-autodoc-typehints 3.x already warns of APIs Sphinx 10 removes.
    "sphinx>=7,<10",
    "sphinx-autodoc-typehints>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
python_classes = ["Describe*"]
python_functions = ["it_*", "and_it_*", "but_it_*", "test_*", "bench_*"]
markers = [
    "perf: opt-in performance benchmark (run with `pytest -m perf`)",
    "realworld: round-trip tests over the Apache POI corpus in tests/test_files/real_world/",
]
addopts = "-m 'not perf'"
