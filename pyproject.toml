[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pypptx"
version = "0.3.0"
description = "Create, read, and modify PowerPoint .pptx files"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "lxml>=4.9",
    "typing_extensions>=4.4",
    "XlsxWriter>=3.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # tests/unitutil/cxml.py parses the compact XML expression language with pyparsing.
    # Capped below 4: it still calls `delimitedList`, `setParseAction`, `dblQuotedString`
    # and `removeQuotes`, which 3.x deprecates (the suite emits the warnings) and 4.x is
    # expected to remove.
    "pyparsing>=3.0,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
python_classes = ["Describe*"]
python_functions = ["it_*", "test_*", "bench_*"]
markers = [
    "perf: opt-in performance benchmark (run with `pytest -m perf`)",
]
addopts = "-m 'not perf'"
